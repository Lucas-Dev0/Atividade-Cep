<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de CEP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Buscador de CEP</h1>

    <form id="form-cep" novalidate>
      <label for="cep">CEP</label>
      <input type="text" id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code">

      <label for="rua">Rua</label>
      <input type="text" id="rua" readonly>

      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" readonly>

      <div class="linha">
        <div>
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" readonly>
        </div>
        <div class="uf">
          <label for="uf">UF</label>
          <input type="text" id="uf" readonly>
        </div>
      </div>

      <p id="mensagem" role="alert" hidden></p>
    </form>

    <section>
      <h2>Últimas buscas</h2>
      <ul id="historico"></ul>
      <p id="historico-vazio">Nenhum CEP buscado ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
